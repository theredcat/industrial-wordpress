services:
  nginx:
    build: _docker/nginx
    environment:
      VIRTUAL_HOST: wp-test-demo
    links:
      - php
    ports:
      - "443:443"
    volumes:
      - .:/app
  
  maildev:
    image: maildev/maildev
    command: [ '--smtp', '25' ]
    ports:
      - 1080:1080
    expose:
      - 25
  
  php:
    build: _docker/php
    links:
      - db
      - es
      - redis
      - maildev
      - minio:bucket.localhost.direct
    volumes:
      - .:/app
    working_dir: /app
    environment:
      LOCALE: en_US
  
      DATABASE_WP_HOST: db
      DATABASE_WP_PORT: 3306
      DATABASE_WP_NAME: wordpress
      DATABASE_WP_USER: wordpress
      DATABASE_WP_PASSWORD: dk8e_z-e5e
  
      AWS_KEY_ID: accesskey
      AWS_ACCESS_KEY: sercretkey
  
      ELASTICPRESS_HOST: es
      ELASTICPRESS_PORT: 9200
      ELASTICPRESS_INDEX: wordpress
      ELASTICPRESS_INDEX_PREFIX: wp_ 
      ELASTICPRESS_NETWORK: "false"
      ELASTICPRESS_PROTOCOL: "http"
  
      WORDPRESS_TITLE: My Industrial wordpress
      WORDPRESS_USERNAME: admin
      WORDPRESS_PASSWORD: cakeisalie
      WORDPRESS_EMAIL: contact@fake.tld
      WORDPRESS_LANGUAGE: fr
      WORDPRESS_MULTISITE: "true"
    user: "1000"
  
  db:
    image: mariadb:12.2.2-ubi
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: dk8e_z-e5e
  
  es:
    image: elasticsearch:9.3.1
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms256m -Xmx256m
    ports:
      - "9200"
  
  redis:
    image: redis

  minio:
    build: _docker/minio
    environment:
      MINIO_ROOT_USER: adminadmin
      MINIO_ROOT_PASSWORD: adminadmin
      BUCKET_TO_CREATE: industrial-wordpress
      MINIO_USER_ACCOUNT: accesskey
      MINIO_USER_PASSWORD: sercretkey
